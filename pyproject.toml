[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "indipygui"
authors = [{name = "Bernard Czenkusz", email = "bernie@skipole.co.uk"}]
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License","Topic :: Scientific/Engineering :: Astronomy", "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator"]
version = "0.0.1"
description="A GUI client which can be used to control remote instruments using the INDI protocol."
readme = "README.md"
requires-python = ">=3.10"
keywords=['indi', 'client', 'astronomy', 'instrument']
dependencies = ["indipyclient>=0.8.6", "customtkinter>=6.0.0"]

[project.urls]
Source = "https://github.com/bernie-skipole/indipygui"

[project.scripts]
indipygui = "indipygui.__main__:main"
